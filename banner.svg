<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#9F7AEA"/>
      <stop offset="100%" stop-color="#ec4899"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bgGrad)"/>

  <!-- scattered particles -->
  <g fill="#9F7AEA">
    <circle cx="60" cy="40" r="1.6" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="250" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="45" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="230" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="25" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="45" cy="150" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="150" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="50%" y="70.0" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="20" xml:space="preserve" fill="url(#nameGrad)" filter="url(#glow)">    ____  _____    ____  _____       _____ __  _____    ____  __  ______ </text>
  <text x="50%" y="97.0" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="20" xml:space="preserve" fill="url(#nameGrad)" filter="url(#glow)">   / __ \/  _/ |  / /\ \/ /   |     / ___// / / /   |  / __ \/  |/  /   |</text>
  <text x="50%" y="124.0" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="20" xml:space="preserve" fill="url(#nameGrad)" filter="url(#glow)">  / / / // / | | / /  \  / /| |     \__ \/ /_/ / /| | / /_/ / /|_/ / /| |</text>
  <text x="50%" y="151.0" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="20" xml:space="preserve" fill="url(#nameGrad)" filter="url(#glow)"> / /_/ // /  | |/ /   / / ___ |    ___/ / __  / ___ |/ _, _/ /  / / ___ |</text>
  <text x="50%" y="178.0" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="20" xml:space="preserve" fill="url(#nameGrad)" filter="url(#glow)">/_____/___/  |___/   /_/_/  |_|   /____/_/ /_/_/  |_/_/ |_/_/  /_/_/  |_|</text>

  <text x="50%" y="231.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="17" letter-spacing="4" fill="#e2e2f0">FOUNDER  •  ECOSYSTEM ARCHITECT  •  BUILDER</text>

  <line x1="340.0" y1="249.0" x2="660.0" y2="249.0" stroke="url(#nameGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
